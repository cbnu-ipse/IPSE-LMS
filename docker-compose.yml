services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipse -d ipse_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_judge:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.judge.docker
    volumes:
      - postgres_judge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipse_judge -d beta_judge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/cbnu-ipse/ipse-lms:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      db_judge:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── 채점 ─────────────────────────────────────────────────────────────
  # judge_worker: 채점 큐(JudgeTask)를 하나씩 꺼내 실행기에 테스트케이스를 보내고 결과를 DB에 쓴다.
  judge_worker:
    image: ghcr.io/cbnu-ipse/ipse-lms:latest
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_judge_worker"]
    env_file:
      - .env.docker
    environment:
      JUDGE_RUNNER_URL: http://judge_runner:8080
    networks:
      - default
      - judge_net
    depends_on:
      db:
        condition: service_healthy
      db_judge:
        condition: service_healthy
      judge_runner:
        condition: service_started

  # judge_runner: 제출 코드를 실제로 실행하는 곳. 인터넷 차단(internal 네트워크만), 비밀 환경변수 없음,
  # 읽기 전용 파일시스템, 권한 제거, 자원 제한. 웹 서버·DB와는 연결되지 않는다 (judge_runner/runner.py 참고)
  judge_runner:
    build:
      context: ./judge_runner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - judge_net

networks:
  judge_net:
    internal: true

volumes:
  postgres_data:
  postgres_judge_data:
  redis_data:
  media_data:
  static_data:
