{% extends 'base.html' %}
{% block title %}수업 수정 - IPSE AI Academy{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />

<section class="max-w-5xl mx-auto px-6 py-12">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

        <div class="bg-gradient-to-r from-amber-50 via-white to-slate-50 border-b border-slate-200 px-8 py-6">
            <h1 class="text-3xl font-semibold text-[#3F3F3F]">수업 수정</h1>
            <p class="text-slate-500 text-sm mt-2 font-medium">{{ course.title }} — {{ lesson.title }}</p>
        </div>

        <form id="lessonEditForm" method="POST" class="p-8 space-y-8">
            {% csrf_token %}

            <div>
                <label for="title" class="block text-sm font-semibold text-slate-700 mb-2">수업 제목</label>
                <input type="text" id="title" name="title" required value="{{ lesson.title }}"
                      class="w-full px-4 py-3 rounded-lg border border-slate-200 bg-slate-50 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium text-slate-800">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">강의 본문 (Markdown 지원)</label>
                <div id="editor"></div>
                <input type="hidden" id="hiddenContent" name="content">
            </div>

            <div class="flex items-center justify-end space-x-4 pt-4 border-t border-slate-100">
                <a href="{% url 'course_detail' course.slug %}" class="px-6 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50 transition">
                    취소
                </a>
                <button type="submit" class="px-8 py-2.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition">
                    수정 저장하기
                </button>
            </div>
        </form>
    </div>
</section>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
{{ lesson.content|json_script:"lesson-content" }}
<script>
    const rawContent = JSON.parse(document.getElementById('lesson-content').textContent);

    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '600px',
        initialEditType: 'markdown',
        previewStyle: 'vertical',
        initialValue: rawContent,
    });

    document.getElementById('lessonEditForm').addEventListener('submit', function(e) {
        const markdownContent = editor.getMarkdown();
        document.getElementById('hiddenContent').value = markdownContent;

        if (!markdownContent.trim()) {
            e.preventDefault();
            alert('강의 본문을 작성해주세요!');
        }
    });
</script>
{% endblock %}
