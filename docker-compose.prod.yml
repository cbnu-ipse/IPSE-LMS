# ==========================================
# IPSE LMS — Production Deployment Override
# 이 파일은 프로덕션 배포 환경 전용 설정을 정의합니다.
# 배포 서버 기동 시: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ==========================================

services:

  web:
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

  # 매일 새벽 PostgreSQL 백업 → 서버 디스크(./backups/postgres)에 gzip으로 14일치 보관 (docker/backup.sh, docker/BACKUP.md)
  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ./backups/postgres:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
      db_judge:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.docker
    depends_on:
      - nginx
